name: Validate release tag

# Guards the release process: when a `vX.Y.Z` tag is pushed, this checks it
# against custom_components/powerbaas/manifest.json's "version" field.
# On a mismatch the tag (and any release created from it) is deleted so a
# wrong tag never sticks around for HACS to pick up.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Compare tag to manifest version
        id: check
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          manifest_version=$(python3 -c "import json; print(json.load(open('custom_components/powerbaas/manifest.json'))['version'])")
          echo "Tag: $tag_version / manifest.json: $manifest_version"
          if [ "$tag_version" != "$manifest_version" ]; then
            echo "mismatch=true" >> "$GITHUB_OUTPUT"
          fi
          echo "manifest_version=$manifest_version" >> "$GITHUB_OUTPUT"

      - name: Delete mismatched tag and release
        if: steps.check.outputs.mismatch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "${GITHUB_REF_NAME}" --yes || true
          git push origin ":refs/tags/${GITHUB_REF_NAME}"

      - name: Fail with explanation
        if: steps.check.outputs.mismatch == 'true'
        run: |
          echo "::error::Tag ${GITHUB_REF_NAME} does not match manifest.json version (${{ steps.check.outputs.manifest_version }}). The tag has been deleted - fix manifest.json, then re-tag."
          exit 1
